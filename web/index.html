<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>Mr. Mahmoud AI</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#f8fafc}*{box-sizing:border-box}.app{max-width:720px;margin:auto;padding:18px}.card{background:#151d31;border:1px solid #26314a;border-radius:18px;padding:16px;margin:12px 0}textarea,input,select,button{width:100%;padding:13px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff;font:inherit}button{background:#2563eb;border:0;margin-top:10px;font-weight:700}button.secondary{background:#334155}.row{display:flex;gap:8px}.row>*{flex:1}.msg{padding:12px;border-radius:14px;margin:8px 0;white-space:pre-wrap}.u{background:#1d4ed8}.a{background:#1e293b}.small{opacity:.7;font-size:13px}.ok{color:#86efac}.err{color:#fca5a5}</style></head><body><main class="app"><h1>🤖 محمود AI</h1><div class="small">دستیار شخصی هوشمند — GPT + Claude + Agent</div><div class="card"><div class="small">Backend: همین آدرس سایت (خودکار)</div><div id="health" class="small"></div></div><div class="card"><select id="provider"><option value="auto">خودکار</option><option value="openai">GPT</option><option value="claude">Claude</option></select><textarea id="q" rows="5" placeholder="چه کاری برایت انجام بدهم؟"></textarea><div class="row"><button onclick="chat()">ارسال</button><button onclick="agent()">اجرای Agent</button></div></div><div id="out"></div></main><script>const $=id=>document.getElementById(id);function base(){return location.origin}const FN='/.netlify/functions/api';function save(){check()}async function check(){try{let r=await fetch(FN+'/health');let j=await r.json();$('health').innerHTML='<span class="ok">● آنلاین — نسخه '+j.version+'</span>'}catch(e){$('health').innerHTML='<span class="err">Backend در دسترس نیست</span>'}}function add(who,text){$('out').insertAdjacentHTML('beforeend',`<div class="msg ${who==='u'?'u':'a'}">${escape(text)}</div>`)}function escape(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}async function chat(){let q=$('q').value.trim();if(!q)return;add('u',q);$('q').value='';try{let r=await fetch(FN+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:$('provider').value,messages:[{role:'user',content:q}]})});let j=await r.json();add('a',j.text||j.error||('خطای ناشناخته (HTTP '+r.status+')'))}catch(e){add('a','اتصال به Backend برقرار نشد: '+e.message)}}async function agent(){let q=$('q').value.trim();if(!q)return;add('u','Agent: '+q);try{let r=await fetch(FN+'/api/agent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:$('provider').value,goal:q})});let j=await r.json();add('a',j.error||('برنامه ساخته شد:\n'+JSON.stringify(j.plan,null,2)))}catch(e){add('a','خطا در Agent')}}check();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script></body></html>
